# ═══════════════════════════════════════════════════
# OpenLiteSpeed Virtual Host config for psycho-dash
# Domain: psycho.kentbusinesscollege.net
# ═══════════════════════════════════════════════════
#
# 1) Add a new Virtual Host in OLS Admin → Virtual Hosts
#    Doc Root: /var/www/psycho-dash/backend/staticfiles
#
# 2) Add these rewrite rules under Rewrite tab:
#
# RewriteEngine On
#
# --- Static files (Vite build) ---
# RewriteCond %{REQUEST_URI} ^/assets/
# RewriteRule ^ - [L]
#
# --- Django API ---
# RewriteCond %{REQUEST_URI} ^/api/
# RewriteRule ^(.*)$ http://127.0.0.1:8016$1 [P,L]
#
# --- SPA fallback (all other routes → index.html) ---
# RewriteCond %{REQUEST_FILENAME} !-f
# RewriteCond %{REQUEST_FILENAME} !-d
# RewriteRule ^ /dist/index.html [L]
#
# 3) Add an External App (AJP/Proxy):
#    Name:    psycho-dash-backend
#    Address: 127.0.0.1:8016
#    Max Conn: 10
#
# 4) Add the external app to the Context for /api/ path
