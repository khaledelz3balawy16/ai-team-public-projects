version: '3.8'

services:
  CHANGE_ME:
    image: CHANGE_ME:15-alpine
    container_name: doctor_dashboard_db
    environment:
      POSTGRES_DB: doctor_dashboard
      POSTGRES_USER: CHANGE_ME
      POSTGRES_PASSWORD: CHANGE_ME
    ports:
      - "5432:5432"
    volumes:
      - CHANGE_ME_data:/var/lib/CHANGE_MEql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U CHANGE_ME"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: doctor_dashboard_backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_data &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      DEBUG: "True"
      DB_NAME: doctor_dashboard
      DB_USER: CHANGE_ME
      DB_PASSWORD: CHANGE_ME
      DB_HOST: CHANGE_ME
      DB_PORT: 5432
      DJANGO_SECRET_KEY: "CHANGE_ME"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - media_files:/app/media
    depends_on:
      CHANGE_ME:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: doctor_dashboard_frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
    depends_on:
      - backend

volumes:
  CHANGE_ME_data:
  media_files:
