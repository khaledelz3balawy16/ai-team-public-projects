<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Attendance</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/icon.png?v=2" />
  <link rel="shortcut icon" href="/favicon.ico?v=2" />
  <link rel="apple-touch-icon" href="/icon.png?v=2" />
  <style>
    :root {
      --bg: #7c37bc;
      --card: #fffdfa;
      --accent: #5f1899;
      --text: #1f2937;
      --err: #b91c1c;
      --muted: #6b7280;
      --bg-soft: #c08cf0;
      --bg-deep: #5f1899;
    }

    body {
      margin: 0;
      padding: 20px 14px;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background:
        radial-gradient(circle at 18% 20%, var(--bg-soft), transparent 34%),
        radial-gradient(circle at 82% 18%, #e4cdf8, transparent 28%),
        linear-gradient(145deg, var(--bg-deep), var(--bg));
      color: var(--text);
    }

    .card {
      width: min(100%, 420px);
      max-width: 420px;
      background: var(--card);
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .08);
      box-sizing: border-box;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 10px;
    }

    .brand-logo {
      display: block;
      max-width: 150px;
      width: auto;
      height: auto;
      object-fit: contain;
      order: 2;
    }

    .brand-title {
      margin: 0;
      font-size: 1.6rem;
      line-height: 1.15;
      color: rgb(105, 28, 168);
      order: 1;
      text-align: left;
    }

    input,
    button {
      width: 100%;
      box-sizing: border-box;
      border-radius: 10px;
      font-size: 1rem;
    }

    .input-label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
    }

    input {
      border: 1px solid #d1d5db;
      padding: 12px 44px 12px 12px;
      margin: 0;
    }

    .email-wrap {
      margin-bottom: 12px;
    }

    .email-input-wrap {
      position: relative;
    }

    .email-status {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.1rem;
      color: var(--muted);
      user-select: none;
      pointer-events: none;
    }

    .email-status.ok {
      color: var(--accent);
    }

    .email-status.error {
      color: var(--err);
    }

    button {
      border: 0;
      padding: 12px;
      font-weight: 600;
      background: linear-gradient(145deg, var(--bg-deep), var(--bg));
      color: white;
      cursor: pointer;
    }

    button:disabled {
      opacity: .7;
      cursor: wait;
    }

    button:hover {
      filter: brightness(1.05);
    }

    #msg {
      margin-top: 8px;
      min-height: 1.2em;
    }

    .error {
      color: var(--err);
    }

    .ok {
      color: var(--accent);
      font-size: 1.15rem;
      font-weight: 700;
    }

    .hint-box {
      margin-top: 12px;
      margin-bottom: 15px;

      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      background: #f8fafc;
      color: #334155;
      font-size: 0.92rem;
      line-height: 1.5;
    }

    .selection-panel {
      margin-top: 4px;
      display: grid;
      gap: 10px;
    }

    .selection-panel[hidden] {
      display: none;
    }

    .field-label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
    }

    select {
      width: 100%;
      box-sizing: border-box;
      border-radius: 10px;
      font-size: 1rem;
      border: 1px solid #d1d5db;
      padding: 12px;
      background: white;
    }

    .radio-group {
      display: grid;
      gap: 10px;
    }

    .radio-option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      background: white;
    }

    .radio-option input {
      width: auto;
      margin: 0;
      padding: 0;
    }

    .radio-option.current-group {
      border-style: dashed;
      border-color: var(--accent);
      background: #faf5ff;
    }

    .radio-copy {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .radio-caption {
      color: var(--accent);
      font-size: 0.82rem;
      font-weight: 600;
    }

    .radio-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .radio-row .radio-option {
      align-items: flex-start;
      min-height: 72px;
      padding: 12px 14px;
    }

    .radio-row .radio-copy {
      gap: 4px;
    }

    .radio-row .radio-copy>span:first-child {
      font-weight: 600;
      line-height: 1.2;
    }

    .radio-row .radio-caption {
      color: var(--muted);
      font-size: 0.86rem;
      font-weight: 500;
      line-height: 1.25;
    }

    .radio-row .radio-option input {
      margin-top: 3px;
    }

    .radio-option.disabled {
      opacity: 0.55;
      background: #f8fafc;
      cursor: not-allowed;
    }

    .radio-option.disabled input {
      pointer-events: none;
    }

    .sub-select-wrap {
      margin-top: 10px;
    }

    .sub-select-wrap[hidden] {
      display: none;
    }

    .search-wrap {
      position: relative;
    }

    .search-results {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      max-height: 220px;
      overflow-y: auto;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.08);
      z-index: 10;
    }

    .search-results[hidden] {
      display: none;
    }

    .search-option {
      width: 100%;
      border: 0;
      border-bottom: 1px solid #e5e7eb;
      background: #fff;
      text-align: left;
      padding: 10px 12px;
      font-size: 0.95rem;
      color: var(--text);
    }

    .search-option:last-child {
      border-bottom: 0;
    }

    .search-option:hover {
      background: #f8fafc;
    }

    @media (max-width: 520px) {
      body {
        min-height: 100dvh;
        padding: 10vh 15px 10vh;
        place-items: start center;
        box-sizing: border-box;
        overflow-x: hidden;
      }

      .card {
        width: 100%;
        margin-top: 0;
        padding: 16px;
        border-radius: 14px;
      }

      .brand {
        gap: 12px;
      }

      .brand-logo {
        max-width: 130px;
      }

      .brand-title {
        font-size: 1.15rem;
        line-height: 1.1;
      }

      .radio-row {
        grid-template-columns: 1fr;
      }

      .radio-row .radio-option {
        min-height: auto;
      }

      input,
      button,
      select {
        font-size: 16px;
      }

      .hint-box {
        margin-bottom: 12px;
      }
    }

  </style>
</head>

<body>
  <main class="card">
    <div class="brand">
      <img class="brand-logo" src="/brand-logo.webp" alt="Kent Business College">
      <h2 class="brand-title">QR Attendance</h2>
    </div>
    <form id="loginForm">
      {% csrf_token %}
      <div class="email-wrap">
        <label class="input-label" for="email">Aptem Email:</label>
        <div class="email-input-wrap">
          <input id="email" type="email" placeholder="Enter your Aptem email" required />
          <span id="emailStatus" class="email-status" aria-hidden="true"></span>
        </div>
      </div>
      <div id="selectionPanel" class="selection-panel" hidden>
        <div>
          <span class="field-label">Choose Module:</span>
          <div id="groupOptions" class="radio-group"></div>
          <div id="allGroupsWrap" class="sub-select-wrap" hidden>
            <label class="field-label" for="allGroupsSearch">Search for another Module</label>
            <div class="search-wrap">
              <input id="allGroupsSearch" type="text" placeholder="Type to search for a Module" autocomplete="off" />
              <div id="allGroupsResults" class="search-results" hidden></div>
            </div>
          </div>
        </div>
        <div id="reasonWrap" hidden>
          <span class="field-label">Attendance Reason</span>
          <div id="reasonOptions" class="radio-row"></div>
        </div>
      </div>
      <div id="attendanceHint" class="hint-box">
        Please note that attendance submitted via this form will be recorded for today only.
      </div>
      <button id="submitBtn" type="submit">Submit</button>
      <div id="msg" aria-live="polite"></div>
    </form>
  </main>

  <script>
    const form = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const emailStatus = document.getElementById('emailStatus');
    const submitBtn = document.getElementById('submitBtn');
    const msg = document.getElementById('msg');
    const attendanceHint = document.getElementById('attendanceHint');
    const selectionPanel = document.getElementById('selectionPanel');
    const groupOptions = document.getElementById('groupOptions');
    const allGroupsWrap = document.getElementById('allGroupsWrap');
    const allGroupsSearch = document.getElementById('allGroupsSearch');
    const allGroupsResults = document.getElementById('allGroupsResults');
    const reasonWrap = document.getElementById('reasonWrap');
    const reasonOptions = document.getElementById('reasonOptions');
    const csrfTokenInput = document.querySelector('input[name="csrfmiddlewaretoken"]');
    let awaitingSelection = false;
    let cachedAllGroups = [];
    let recordedAttendanceEmail = '';
    let recordedAttendanceUntil = 0;
    const ATTENDANCE_LOCK_WINDOW_MS = 2 * 60 * 60 * 1000;

    function setMessage(text, type) {
      msg.textContent = text;
      msg.className = type;
    }

    function setStatus(symbol, type) {
      emailStatus.textContent = symbol;
      emailStatus.className = `email-status ${type}`;
    }

    function resetSelections() {
      awaitingSelection = false;
      selectionPanel.hidden = true;
      groupOptions.innerHTML = '';
      allGroupsWrap.hidden = true;
      allGroupsSearch.value = '';
      allGroupsSearch.dataset.selectedValue = '';
      allGroupsResults.innerHTML = '';
      allGroupsResults.hidden = true;
      reasonOptions.innerHTML = '';
      submitBtn.textContent = 'Submit';
    }

    function unlockAttendanceState() {
      recordedAttendanceEmail = '';
      recordedAttendanceUntil = 0;
      submitBtn.disabled = false;
      submitBtn.textContent = 'Submit';
      attendanceHint.hidden = false;
    }

    function lockAttendanceState(email, nextAllowedAt = null) {
      recordedAttendanceEmail = String(email || '').trim().toLowerCase();
      const parsedNextAllowedAt = nextAllowedAt ? new Date(nextAllowedAt).getTime() : NaN;
      recordedAttendanceUntil = Number.isFinite(parsedNextAllowedAt)
        ? parsedNextAllowedAt
        : Date.now() + ATTENDANCE_LOCK_WINDOW_MS;
      submitBtn.disabled = false;
      submitBtn.textContent = 'Attendance Confirmed';
      attendanceHint.hidden = true;
    }

    function hasActiveAttendanceLock(email) {
      const normalizedEmail = String(email || '').trim().toLowerCase();
      if (!recordedAttendanceEmail || recordedAttendanceEmail !== normalizedEmail) {
        return false;
      }
      if (!recordedAttendanceUntil || Date.now() >= recordedAttendanceUntil) {
        unlockAttendanceState();
        return false;
      }
      return true;
    }

    function buildRadioOption({ name, value, label, checked = false, caption = '', className = '' }) {
      const wrapper = document.createElement('label');
      wrapper.className = `radio-option ${className}`.trim();

      const input = document.createElement('input');
      input.type = 'radio';
      input.name = name;
      input.value = value;
      input.checked = checked;

      const copy = document.createElement('span');
      copy.className = 'radio-copy';

      const title = document.createElement('span');
      title.textContent = label;
      copy.appendChild(title);

      if (caption) {
        const meta = document.createElement('span');
        meta.className = 'radio-caption';
        meta.textContent = caption;
        copy.appendChild(meta);
      }

      wrapper.appendChild(input);
      wrapper.appendChild(copy);
      return wrapper;
    }

    function setGroupOptions(groups, currentGroup) {
      groupOptions.innerHTML = '';
      (groups || []).forEach((group, index) => {
        const isCurrentGroup = currentGroup && group === currentGroup;
        const shouldCheck = isCurrentGroup || ((groups || []).length === 1 && index === 0);
        groupOptions.appendChild(buildRadioOption({
          name: 'selectedGroup',
          value: group,
          label: group,
          checked: shouldCheck,
          caption: isCurrentGroup ? 'Current Module' : '',
          className: isCurrentGroup ? 'current-Module' : '',
        }));
      });
      groupOptions.appendChild(buildRadioOption({
        name: 'selectedGroup',
        value: '__another__',
        label: 'Another Module',
      }));
    }

    function getSelectedGroup() {
      const checked = document.querySelector('input[name="selectedGroup"]:checked');
      if (!checked) return '';
      if (checked.value === '__another__') {
        return allGroupsSearch.dataset.selectedValue || '';
      }
      return checked.value;
    }

    function getSelectedGroupMode() {
      const checked = document.querySelector('input[name="selectedGroup"]:checked');
      return checked ? checked.value : '';
    }

    function setAllGroupOptions(groups) {
      cachedAllGroups = Array.isArray(groups) ? groups : [];
      allGroupsSearch.value = '';
      allGroupsSearch.dataset.selectedValue = '';
      allGroupsResults.innerHTML = '';
      allGroupsResults.hidden = true;
    }

    function renderGroupSearchResults(query) {
      const term = String(query || '').trim().toLowerCase();
      allGroupsResults.innerHTML = '';
      if (!term) {
        allGroupsResults.hidden = true;
        return;
      }

      const matches = cachedAllGroups
        .filter((group) => group.toLowerCase().includes(term))
        .slice(0, 12);

      if (!matches.length) {
        allGroupsResults.hidden = true;
        return;
      }

      matches.forEach((group) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'search-option';
        button.textContent = group;
        button.addEventListener('click', () => {
          allGroupsSearch.value = group;
          allGroupsSearch.dataset.selectedValue = group;
          allGroupsResults.hidden = true;
          syncReasonState();
        });
        allGroupsResults.appendChild(button);
      });

      allGroupsResults.hidden = false;
    }

    function setReasonOptions() {
      reasonOptions.innerHTML = '';
      const reasons = [
        { value: 'catch_up', label: 'Catch-up', caption: 'Attending a missed class' },
        { value: 'transferred', label: 'Transferred', caption: 'Moved from another module' },
      ];
      reasons.forEach((reason) => {
        reasonOptions.appendChild(buildRadioOption({
          name: 'attendanceReason',
          value: reason.value,
          label: reason.label,
          caption: reason.caption,
        }));
      });
      syncReasonState();
    }

    function getSelectedReason() {
      const checked = document.querySelector('input[name="attendanceReason"]:checked');
      return checked ? checked.value : '';
    }

    function clearReasonSelection() {
      document.querySelectorAll('input[name="attendanceReason"]').forEach((input) => {
        input.checked = false;
      });
    }

    function syncReasonState() {
      const selectedGroup = getSelectedGroup();
      const mode = getSelectedGroupMode();
      const shouldShowReason = mode === '__another__' && !!selectedGroup;

      allGroupsWrap.hidden = mode !== '__another__';
      reasonWrap.hidden = !shouldShowReason;
      if (mode !== '__another__') {
        allGroupsSearch.value = '';
        allGroupsSearch.dataset.selectedValue = '';
        allGroupsResults.hidden = true;
      }

      document.querySelectorAll('#reasonOptions .radio-option').forEach((option) => {
        option.classList.toggle('disabled', !shouldShowReason);
      });

      document.querySelectorAll('input[name="attendanceReason"]').forEach((input) => {
        input.disabled = !shouldShowReason;
      });

      if (!shouldShowReason) {
        clearReasonSelection();
      }
    }

    function showSelectionPanel(groups, currentGroup, allGroups) {
      awaitingSelection = true;
      setGroupOptions(groups, currentGroup);
      setAllGroupOptions(allGroups);
      setReasonOptions();
      selectionPanel.hidden = false;
      submitBtn.textContent = 'Confirm Attendance';
    }

    function isValidAptemEmail(value) {
      const email = value.trim();
      if (!email) return false;
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    emailInput.addEventListener('input', () => {
      unlockAttendanceState();
      setStatus('', '');
      setMessage('', '');
      resetSelections();
    });

    document.addEventListener('change', (event) => {
      if (event.target && event.target.name === 'selectedGroup') {
        syncReasonState();
      }
    });

    document.addEventListener('click', (event) => {
      const insideSearch = event.target === allGroupsSearch || allGroupsResults.contains(event.target);
      if (!insideSearch) {
        allGroupsResults.hidden = true;
      }
    });

    allGroupsSearch.addEventListener('input', () => {
      allGroupsSearch.dataset.selectedValue = '';
      renderGroupSearchResults(allGroupsSearch.value);
      syncReasonState();
    });

    allGroupsSearch.addEventListener('focus', () => {
      if (allGroupsSearch.value.trim()) {
        renderGroupSearchResults(allGroupsSearch.value);
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = emailInput.value.trim();
      const csrfToken = csrfTokenInput ? csrfTokenInput.value : '';
      const selectedGroup = getSelectedGroup();
      const attendanceReason = getSelectedReason();
      let lockSubmit = false;
      setMessage('', '');

      if (!isValidAptemEmail(email)) {
        setStatus('\u2717', 'error');
        setMessage('Please enter your Aptem email', 'error');
        return;
      }

      if (hasActiveAttendanceLock(email)) {
        setStatus('\u2713', 'ok');
        setMessage('Attendance already recorded for this email.', 'ok');
        return;
      }

      if (!awaitingSelection) {
        resetSelections();
      } else {
        if (!selectedGroup) {
          setStatus('\u2717', 'error');
          setMessage('Please choose the group.', 'error');
          return;
        }
        if (getSelectedGroupMode() === '__another__' && !attendanceReason) {
          setStatus('\u2717', 'error');
          setMessage('Please choose attendance reason.', 'error');
          return;
        }
      }

      submitBtn.disabled = true;

      try {
        const response = await fetch('/api/auth/student-login/', {
          method: 'POST',
          credentials: 'same-origin',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': csrfToken
          },
          body: JSON.stringify({
            email,
            selected_group: awaitingSelection ? selectedGroup : '',
            attendance_reason: awaitingSelection && getSelectedGroupMode() === '__another__' ? attendanceReason : ''
          })
        });

        const contentType = response.headers.get('content-type') || '';
        const data = contentType.includes('application/json')
          ? await response.json()
          : { detail: await response.text() };

        if (response.ok && data.needs_selection) {
          setStatus('\u2713', 'ok');
          setMessage('', '');
          showSelectionPanel(data.available_groups || [], data.group || '', data.all_groups || []);
          return;
        }

        if (response.ok && data.ok) {
          const successMessage = data.message || 'Attendance recorded successfully.';
          lockSubmit = true;
          resetSelections();
          setStatus('\u2713', 'ok');
          setMessage(successMessage, 'ok');
          lockAttendanceState(email, data.next_allowed_at);
          return;
        }

        setStatus('\u2717', 'error');
        if (response.status === 403 && typeof data.detail === 'string' && data.detail.includes('CSRF verification failed')) {
          setMessage('Security token expired. Please refresh the page and try again.', 'error');
          return;
        }
        if (response.status === 429) {
          lockSubmit = true;
          resetSelections();
          setMessage(data.detail || 'Attendance already recorded.', 'error');
          lockAttendanceState(email, data.next_allowed_at);
          return;
        }
        if (data.available_groups && data.available_groups.length) {
          showSelectionPanel(data.available_groups || [], data.group || '', data.all_groups || []);
        }
        setMessage(data.detail || 'Please enter your Aptem email', 'error');
      } catch (error) {
        setStatus('\u2717', 'error');
        setMessage('Cannot reach backend. Open this page from Django server: http://127.0.0.1:8000/', 'error');
      } finally {
        if (!lockSubmit) {
          submitBtn.disabled = false;
        }
      }
    });
  </script>
</body>

</html>
